<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Paper (ground)","default":"#22335E"},
    {"id":"color-cream","type":"color","label":"Cream (tags, borders)","default":"#F3EAD7"},
    {"id":"color-ink","type":"color","label":"Ink (type on cream)","default":"#16213E"},
    {"id":"color-accent","type":"color","label":"Highlighter","default":"#FFD43B"},
    {"id":"color-mark","type":"color","label":"Annotation red","default":"#D7372B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Night Sky Is a Museum</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #22335e;
        --color-cream: #f3ead7;
        --color-ink: #16213e;
        --color-accent: #ffd43b;
        --color-mark: #d7372b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e1527;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: #0e1527;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28.8"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>

      <!-- Scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.62" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="stepout" data-composition-id="stepout" data-composition-src="compositions/stepout.html"
        data-start="2.62" data-duration="2.08" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="already" data-composition-id="already" data-composition-src="compositions/already.html"
        data-start="4.7" data-duration="1.45" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="plates" data-composition-id="plates" data-composition-src="compositions/plates.html"
        data-start="6.15" data-duration="9.85" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="stars" data-composition-id="stars" data-composition-src="compositions/stars.html"
        data-start="16.0" data-duration="6.75" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="photo" data-composition-id="photo" data-composition-src="compositions/photo.html"
        data-start="22.75" data-duration="2.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="museum" data-composition-id="museum" data-composition-src="compositions/museum.html"
        data-start="25.05" data-duration="3.75" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="note" data-composition-id="note" data-composition-src="compositions/note.html"
        data-start="3.82" data-duration="2.25" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:3"></div>

      <!-- Captions (one host for every group) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="28.8" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index:5"></div>

      <!-- Voice, music -->
      <audio id="vo" class="clip" src="assets/audio/vo.wav" data-start="0" data-duration="26.26" data-track-index="3" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="28.8" data-track-index="4" data-volume="1"></audio>

      <!-- Sound on visible actions (peaks land one frame after the picture) -->
      <audio id="sfx-whip-1" class="clip" src="assets/audio/sfx_whoosh1.wav" data-start="5.92" data-duration="0.79" data-track-index="5" data-volume="0.5"></audio>

      <audio id="sfx-circle" class="clip" src="assets/audio/sfx_marker.wav" data-start="16.28" data-duration="0.87" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-tag-star" class="clip" src="assets/audio/sfx_paper_slap2.wav" data-start="17.37" data-duration="0.45" data-track-index="6" data-volume="0.7"></audio>

      <audio id="sfx-era-2" class="clip" src="assets/audio/sfx_tick_b.wav" data-start="21.09" data-duration="0.65" data-track-index="9" data-volume="0.4"></audio>
      <audio id="sfx-era-3" class="clip" src="assets/audio/sfx_tick_c.wav" data-start="21.27" data-duration="0.51" data-track-index="11" data-volume="0.4"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

</html>
